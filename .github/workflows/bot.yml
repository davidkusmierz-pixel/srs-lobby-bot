name: SRS LOBBY BOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Usuń problematyczne źródła Microsoftu
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.sources

      - name: Zainstaluj Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Zainstaluj biblioteki Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uruchom bota SRS
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -u main.py
